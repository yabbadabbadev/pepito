version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
      time: '21:00'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
      exclude:
        - '@yabbadabbadev/*'
    groups:
      security:
        applies-to: security-updates
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
      security-major:
        applies-to: security-updates
        update-types:
          - 'major'
        patterns:
          - '*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router'
          - '@types/react*'
      vite:
        patterns:
          - '@vitejs/*'
      oxlint:
        patterns:
          - 'oxlint*'
      prettier:
        patterns:
          - 'prettier'
      testing:
        patterns:
          - 'vitest-browser-react'
          - 'vitest-browser-vue'
          - 'vitest-browser-svelte'
          - '@vitest/browser*'
          - 'playwright'
          - 'msw'
          - 'vitest'
      frameworks:
        patterns:
          - 'vue'
          - 'svelte'
          - '@sveltejs/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
      time: '21:00'
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns:
          - '*'
