name: publish

# Publishes @yabbadabbadev/pepito to the npm registry. Triggered by pushing a
# vX.Y.Z tag (normal release) or manually from the Actions UI
# (workflow_dispatch), which publishes whatever is in package.json on the
# chosen ref, without requiring a tag to exist.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          # Without this, NODE_AUTH_TOKEN authenticates nothing: setup-node
          # only writes the registry URL into the runner's .npmrc when passed
          # registry-url explicitly.
          registry-url: 'https://registry.npmjs.org'

      - name: Install package
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Version guard
        # Only applies to the tag trigger: a tag that doesn't match the
        # package.json version would publish a different version than the
        # one the tag announces, and whoever sees vX.Y.Z on GitHub needs to
        # be able to trust it's what's in the registry under that number.
        # workflow_dispatch has no tag to compare against, so this guard
        # doesn't apply to it: it publishes whatever is on the chosen ref.
        if: github.event_name == 'push'
        run: |
          VERSION_TAG="v$(node -p "require('./package.json').version")"
          if [ "$VERSION_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package.json version ($VERSION_TAG). Update the tag or the version before publishing." >&2
            exit 1
          fi

      - name: Publish to npm
        # No --provenance while this repository is private: the registry
        # rejects provenance from private sources (measured on the v0.1.0
        # publish attempt: E422 "Only public source repositories are
        # supported"). Re-enable it, plus the id-token: write permission it
        # needs, when the repo goes public — tracked in the ROADMAP. No
        # --access: public access is already set in package.json's
        # publishConfig.
        run: npm publish
        env:
          # NPM_TOKEN is a granular npm token (Read and write, automation
          # type, with publish permission on the package or the
          # @yabbadabbadev scope) stored as a GitHub secret: it must be set
          # on THIS repo, either as a repo secret or as an organization
          # secret if it's going to serve more packages in the scope. The
          # automation type is what allows publishing from CI without an
          # interactive OTP blocking the job.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
