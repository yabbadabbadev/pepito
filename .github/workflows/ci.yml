name: ci

# Quality gate for the package: blocks the merge if lint, format, typecheck
# or tests with coverage fail. The minimum coverage (90% lines and branches)
# is enforced by vitest's coverage config, not by this workflow.
on:
  pull_request:
  # Measured 2026-08-20: the premise this trigger was built on was only half
  # right. The release PR's CREATION does trigger ci.yml through the
  # pull_request event above, even though release-please opens it with the
  # default GITHUB_TOKEN — GITHUB_TOKEN only blocks triggers on refs/commits
  # IT pushes, not on the pull_request event itself. What GITHUB_TOKEN does
  # block is any later push the bot makes to update its own branch (a new
  # commit added to an existing release PR): that push fires neither
  # pull_request nor, it turns out, this push trigger, since that push is
  # also made with GITHUB_TOKEN. So this trigger is a human-push escape
  # hatch, not the guarantee it was designed to be — the actual guarantee
  # that the release PR's `quality` check eventually reports is the manual
  # workflow-run approval documented in CONTRIBUTING.md (runs for the bot's
  # PR land in `action_required` until a human approves them). This trigger
  # still earns its keep on any human push to a matching branch. It's scoped
  # to the branches release-please-action creates (see branch-name.js in
  # release-please: `release-please--branches--<target-branch>`); measured
  # in this repo, that name also carries a `--components--<name>` suffix
  # even for a single-package repo, which the glob below still matches.
  push:
    branches: ['release-please--**']
  # Deliberate, do not remove: re-runs the quality gate against an arbitrary
  # ref with no fabricated commit, and was used for exactly that when a
  # release PR was left with no check. Harmless here in a way it would not
  # be on the publish workflow: this workflow publishes nothing, holds no
  # secret and involves no OIDC identity, and only users with write access
  # can dispatch it, so the worst case is spent Actions minutes. On the
  # publishing workflow the same trigger is a documented npm trusted-
  # publisher validation mismatch risk, because it enters npm's OIDC claim
  # validation — that is why it was deliberately removed from that path
  # rather than kept for symmetry with this one.
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install package
        run: npm ci

      - name: Service worker matches the installed msw
        # `npx msw init` generates this file and MSW only warns about a
        # version mismatch through console.warn, which the default reporter
        # does not surface: a 2.15.0 script ran the whole 3.0.4 suite with
        # nothing red on 2026-11-14. This meter reports both versions.
        run: |
          installed="$(node -p "require('msw/package.json').version")"
          committed="$(sed -n "s/^const PACKAGE_VERSION = '\(.*\)'$/\1/p" public/mockServiceWorker.js)"
          if [ "$installed" != "$committed" ]; then
            echo "public/mockServiceWorker.js was generated by msw $committed but msw $installed is installed. Run: npx msw init public --save" >&2
            exit 1
          fi

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        # No --with-deps: ubuntu-latest already ships the system libraries
        # Chromium needs, and --with-deps' apt-get update against the
        # runner's mirror stalled for 19 minutes and hit timeout-minutes in
        # run 32273966257, blocking the `quality` required check. `npm run
        # setup` (plain playwright install) is for local use, where those
        # system libraries already exist for the same reason. Not gated on
        # the cache-hit output above: this install is a no-op when the
        # browser is already cached, and gating it risks a cache hit with no
        # browser underneath it.
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Closes the tsconfig.build.json (types: []) blind spot: the typecheck
      # step above uses tsconfig.json, not the build one, so a broken dist/
      # could pass this gate unnoticed until a manual `npm run pack:local`.
      - name: Build
        run: npm run build

      - name: Tests with coverage (90/90 threshold enforced in config)
        run: npm run coverage

      - name: Tests against the oldest supported msw (2.15.0)
        # Backs the `^2.15.0 || ^3.0.0` peer range with a real run. `npm ci`
        # has already produced a locked tree; installing msw without
        # --package-lock=false keeps the rest of it intact (measured
        # 2026-11-14: playwright stayed 1.65.0 and vite was still present).
        # The worker is regenerated for 2.15.0 so the run never pairs a 3.x
        # script with a 2.x client.
        run: |
          npm i --no-save msw@2.15.0
          npx msw init public --save
          npm test
