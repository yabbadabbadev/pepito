name: ci

# Quality gate for the package: blocks the merge if lint, format, typecheck
# or tests with coverage fail. The minimum coverage (90% lines and branches)
# is enforced by vitest's coverage config, not by this workflow.
on:
  pull_request:
  # release-please opens its release PR with the default GITHUB_TOKEN, and a
  # pull request created with that token does not trigger other workflows —
  # so pull_request above never fires for it. Without this push trigger, a
  # ruleset requiring the `quality` check on main would leave every release
  # PR permanently unmergeable (the check could never report), with an
  # unplanned admin bypass as the only escape. This produces a check run on
  # the same head SHA the ruleset evaluates, scoped to the branches
  # release-please-action creates (see branch-name.js in release-please:
  # `release-please--branches--<target-branch>`, optionally with
  # `--components--<name>` or `--groups--<name>` suffixes for multi-package
  # setups).
  push:
    branches: ['release-please--**']
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install package
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        # No --with-deps: ubuntu-latest already ships the system libraries
        # Chromium needs, and --with-deps' apt-get update against the
        # runner's mirror stalled for 19 minutes and hit timeout-minutes in
        # run 32273966257, blocking the `quality` required check. `npm run
        # setup` (plain playwright install) is for local use, where those
        # system libraries already exist for the same reason. Not gated on
        # the cache-hit output above: this install is a no-op when the
        # browser is already cached, and gating it risks a cache hit with no
        # browser underneath it.
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Closes the tsconfig.build.json (types: []) blind spot: the typecheck
      # step above uses tsconfig.json, not the build one, so a broken dist/
      # could pass this gate unnoticed until a manual `npm run pack:local`.
      - name: Build
        run: npm run build

      - name: Tests with coverage (90/90 threshold enforced in config)
        run: npm run coverage
